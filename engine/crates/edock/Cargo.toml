[package]
name = "edock"
description = "Tiny, fast container runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
edock-image = { path = "../edock-image" }
edock-proto = { path = "../edock-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# gzip uploads to PUT /containers/{id}/archive (DDEV sends them).
flate2 = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
# HTTPS for container names: the same rustls and ring ureq already brings in.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }

[target.'cfg(any(unix, windows))'.dependencies]
libc = "0.2"

[target.'cfg(unix)'.dependencies]
edock-vmm = { path = "../edock-vmm" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSNotification", "NSGeometry", "NSObject", "NSAppleScript", "NSDictionary"] }


# The tests read back the tar archives the managed builder writes.
[dev-dependencies]
tar = "0.4"


[lints]
workspace = true
