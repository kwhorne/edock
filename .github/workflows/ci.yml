name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Apple silicon, as eDock is.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine
            desktop
            scripts/update-key

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json

      - name: Engine tests
        working-directory: engine
        run: cargo test --locked -p edock -p edock-image -p edock-proto

      - name: Frontend build
        working-directory: desktop/app
        run: npm ci && npm run build

      - name: App tests
        # The integration tests need an engine (they're #[ignore]); these
        # are the unit tests: Kubernetes parsing, names, the update key.
        working-directory: desktop
        run: cargo test --locked

      - name: Bindings match the commands
        working-directory: desktop
        run: |
          cargo install --locked --git https://github.com/kwhorne/elyra-framework --tag v0.55.0 ratatosk
          rata codegen
          git diff --exit-code app/src/bindings.ts

      - name: Update key tool
        working-directory: scripts/update-key
        run: cargo build --locked

      - name: Scripts parse
        run: |
          sh -n scripts/bundle.sh
          sh -n scripts/notices.sh
          bash -n scripts/verify.sh
          bash -n engine/tests/e2e.sh
          python3 -m py_compile engine/tests/parity.py engine/tests/upgrade.py

  guest:
    # The guest agent (edock-init) is Linux code, so its tests run on Linux,
    # Arm as in the VM. As root: it makes device nodes and mounts as the VM's
    # PID 1 does. Built as the runner's user, run with sudo.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Guest agent tests
        working-directory: engine
        run: |
          cargo test --locked -p edock-init --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .executable != null) | .executable' > /tmp/guest-tests
          test -s /tmp/guest-tests
          while read -r t; do sudo "$t"; done < /tmp/guest-tests
